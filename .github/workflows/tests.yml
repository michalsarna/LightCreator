name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-x11-dev libgl1-mesa-dev
      - name: Unit tests
        run: cargo test --workspace

      # End-to-end streaming tests against the real GRBL 1.1h firmware compiled for the PC (grbl-sim).
      - name: Cache grbl-sim
        uses: actions/cache@v4
        with:
          path: target/grbl-sim
          key: grbl-sim-${{ runner.os }}-${{ hashFiles('tools/grbl-sim/build.sh') }}
      - name: Build grbl-sim
        run: tools/grbl-sim/build.sh
      - name: GRBL simulator tests
        run: cargo test -p lightcreator grbl_sim -- --ignored --test-threads=1
