name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libxkbcommon-x11-dev libgl1-mesa-dev
      - name: Unit tests
        run: |
          set -o pipefail
          cargo test --workspace 2>&1 | tee unit-tests.log || {
            # One annotation per failed test (test name and panic message) on the pull request.
            awk '/^---- .* stdout ----$/ { t=$2 } p { print "::error title=unit tests::" t ": " $0; p=0 } /panicked at/ { p=1 }' unit-tests.log
            exit 1
          }

      # End-to-end streaming tests against the real GRBL 1.1h firmware compiled for the PC (grbl-sim).
      - uses: michalsarna/baseCreator/.github/actions/grbl-sim@v2.9.2
      - name: GRBL simulator tests
        run: |
          set -o pipefail
          cargo test -p lightcreator grbl_sim -- --ignored --test-threads=1 2>&1 | tee grbl-sim-tests.log || {
            # One annotation per failed test (test name and panic message) on the pull request.
            awk '/^---- .* stdout ----$/ { t=$2 } p { print "::error title=grbl-sim::" t ": " $0; p=0 } /panicked at/ { p=1 }' grbl-sim-tests.log
            exit 1
          }

  # FreeBSD: the program builds and the unit tests pass (in a FreeBSD virtual machine; no GRBL simulator there).
  freebsd:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: Build and test in FreeBSD
        uses: vmactions/freebsd-vm@v1.6.0
        with:
          release: "15.0"
          usesh: true
          prepare: |
            pkg install -y curl pkgconf libudev-devd evdev-proto libxkbcommon mesa-libs wayland
            curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          run: |
            set -e
            . "$HOME/.cargo/env"
            cargo test --workspace
