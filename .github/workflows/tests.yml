name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-x11-dev libgl1-mesa-dev
      - name: Unit tests
        run: |
          set -o pipefail
          cargo test --workspace 2>&1 | tee unit-tests.log || {
            # Show each failure as an annotation on the pull request.
            grep -E -A3 "^---- .* stdout ----" unit-tests.log | grep -v "^--$" | grep -v "^note:" | sed 's/^/::error title=unit tests::/'
            exit 1
          }

      # End-to-end streaming tests against the real GRBL 1.1h firmware compiled for the PC (grbl-sim).
      - name: Cache grbl-sim
        uses: actions/cache@v4
        with:
          path: target/grbl-sim
          key: grbl-sim-${{ runner.os }}-${{ hashFiles('tools/grbl-sim/build.sh') }}
      - name: Build grbl-sim
        run: tools/grbl-sim/build.sh
      - name: GRBL simulator tests
        run: |
          set -o pipefail
          cargo test -p lightcreator grbl_sim -- --ignored --test-threads=1 2>&1 | tee grbl-sim-tests.log || {
            # Show each failure as an annotation on the pull request.
            grep -E -A3 "^---- .* stdout ----" grbl-sim-tests.log | grep -v "^--$" | grep -v "^note:" | sed 's/^/::error title=grbl-sim::/'
            exit 1
          }
