name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  check-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag must point at a commit on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Tag must match the version in Cargo.toml
        run: |
          v=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          [ "${GITHUB_REF_NAME#v}" = "$v" ] || { echo "tag $GITHUB_REF_NAME != Cargo.toml version $v"; exit 1; }

  build:
    needs: check-main
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, name: linux-x86_64, ext: tar.gz }
          - { os: windows-latest, name: windows-x86_64, ext: zip }
          - { os: macos-latest, name: macos-arm64, ext: tar.gz }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-x11-dev libgl1-mesa-dev
      - run: cargo build --release -p lightcreator
      - name: Package
        shell: bash
        run: |
          mkdir dist
          cp README.md LICENSE dist/
          cp target/release/lightcreator dist/ 2>/dev/null || cp target/release/lightcreator.exe dist/
          name="lightcreator-${GITHUB_REF_NAME}-${{ matrix.name }}"
          if [ "${{ matrix.ext }}" = zip ]; then
            7z a "$name.zip" ./dist/*
          else
            tar czf "$name.tar.gz" -C dist .
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: lightcreator-*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: lightcreator-*
          generate_release_notes: true
