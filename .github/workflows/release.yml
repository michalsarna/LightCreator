name: Release

on:
  push:
    tags: ["v*"]
  # A dry run: builds every package and makes a DRAFT release called dry-run (delete it afterwards). Use it to try the
  # pipeline after a change of the build tools or of the actions it uses, without a tag.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ffmpeg for Windows is cross-compiled on Linux (mingw-w64); the other systems build it on their own runner.
  ffmpeg-windows:
    runs-on: ubuntu-24.04
    steps:
      - id: ff
        uses: michalsarna/baseCreator/.github/actions/ffmpeg@v1.42.0
        with:
          target: windows
      - uses: actions/upload-artifact@v7
        with:
          name: ffmpeg-windows
          path: ${{ steps.ff.outputs.dir }}
  check-main:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Tag must point at a commit on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Tag must match the version in Cargo.toml
        run: |
          v=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          [ "${GITHUB_REF_NAME#v}" = "$v" ] || { echo "tag $GITHUB_REF_NAME != Cargo.toml version $v"; exit 1; }

  build:
    needs: [check-main, ffmpeg-windows]
    if: ${{ !cancelled() && needs.ffmpeg-windows.result == 'success' && (needs.check-main.result == 'success' || needs.check-main.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, name: linux-x86_64, deb: amd64 }
          - { os: ubuntu-24.04-arm, name: linux-arm64, deb: arm64 }
          - { os: windows-latest, name: windows-x86_64 }
          - { os: macos-latest, name: macos-arm64 }
          - { os: macos-15-intel, name: macos-x86_64 }
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.0.0' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-x11-dev libgl1-mesa-dev
      - run: cargo build --release -p lightcreator

      # The small ffmpeg that reads the RTSP stream of a camera comes with every package (LGPL: licence and build recipe go along).
      - name: ffmpeg (Linux, macOS)
        if: runner.os != 'Windows'
        id: ff
        uses: michalsarna/baseCreator/.github/actions/ffmpeg@v1.42.0
      - name: ffmpeg (Windows, built on Linux)
        if: runner.os == 'Windows'
        uses: actions/download-artifact@v8
        with:
          name: ffmpeg-windows
          path: ffmpeg-win
      - name: Put ffmpeg where the packages take it from
        shell: bash
        run: |
          mkdir -p target/ffmpeg
          if [ "$RUNNER_OS" = Windows ]; then cp ffmpeg-win/* target/ffmpeg/; else cp "${{ steps.ff.outputs.dir }}"/* target/ffmpeg/; fi

      # Plain archive (Linux .tar.gz, Windows .zip): binary + README + LICENSE. macOS gets only the .dmg.
      - name: Archive
        if: runner.os != 'macOS'
        shell: bash
        run: |
          mkdir dist
          cp README.md LICENSE LICENSE-APACHE dist/
          cp target/ffmpeg/* dist/
          cp target/release/lightcreator dist/ 2>/dev/null || cp target/release/lightcreator.exe dist/
          name="lightcreator-${TAG}-${{ matrix.name }}"
          if [ "$RUNNER_OS" = Windows ]; then 7z a "$name.zip" ./dist/*; else tar czf "$name.tar.gz" -C dist .; fi

      # Linux: .deb
      - name: Debian package
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-deb --locked
          cargo deb -p lightcreator --no-build --output "lightcreator-${TAG}-linux-${{ matrix.deb }}.deb"

      # Windows: NSIS installer (makensis is preinstalled on the runner image; install it if missing)
      - name: Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) { choco install nsis -y --no-progress; $env:PATH += ";C:\Program Files (x86)\NSIS" }
          $version = $env:TAG.TrimStart('v')
          makensis /V2 "/DVERSION=$version" "/DOUTFILE=$PWD\lightcreator-$env:TAG-windows-x86_64-setup.exe" packaging/windows/installer.nsi

      # macOS: .app bundle inside a .dmg
      - name: macOS app bundle and dmg
        if: runner.os == 'macOS'
        run: |
          cargo install cargo-bundle --locked
          (cd crates/lightcreator && cargo bundle --release)
          # Apple silicon refuses to run code without a valid signature; sign ad hoc (no developer account needed)
          cp target/ffmpeg/* target/release/bundle/osx/LightCreator.app/Contents/Resources/
          codesign --force --sign - target/release/bundle/osx/LightCreator.app/Contents/Resources/ffmpeg
          codesign --force --deep --sign - target/release/bundle/osx/LightCreator.app
          codesign --verify --deep --strict --verbose=2 target/release/bundle/osx/LightCreator.app
          mkdir dmg && cp -R target/release/bundle/osx/LightCreator.app dmg/ && ln -s /Applications dmg/Applications
          # The disk image tool is sometimes still busy with the volume cargo-bundle ejected ("Resource busy"): try again.
          for attempt in 1 2 3 4 5; do
            hdiutil create -volname LightCreator -srcfolder dmg -ov -format UDZO "lightcreator-${TAG}-${{ matrix.name }}.dmg" && break
            [ "$attempt" = 5 ] && exit 1
            sleep 10
          done

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: lightcreator-*

  release:
    needs: build
    # Also after a skipped check-main (a dry run); never after a failed build.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - name: Checksums
        run: sha256sum lightcreator-* > SHA256SUMS.txt
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            lightcreator-*
            SHA256SUMS.txt
          generate_release_notes: true
          draft: ${{ github.ref_type != 'tag' }}
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'dry-run' }}

  # Package managers: the Homebrew tap, winget and the AUR follow every tagged release. Each step runs only when its
  # secret is set, so a missing one never fails the release. The Scoop bucket updates itself (its own workflow).
  packages:
    needs: release
    if: ${{ !cancelled() && needs.release.result == 'success' && github.ref_type == 'tag' }}
    runs-on: ubuntu-24.04
    env:
      TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v7
      - name: Checksums of the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$GITHUB_REF_NAME" -p SHA256SUMS.txt

      # Homebrew: Casks/lightcreator.rb in michalsarna/homebrew-tap gets the new version and both .dmg checksums.
      - name: Homebrew tap
        if: env.TAP_TOKEN != ''
        run: |
          v="${GITHUB_REF_NAME#v}"
          arm=$(grep -- '-macos-arm64.dmg$' SHA256SUMS.txt | cut -d' ' -f1)
          intel=$(grep -- '-macos-x86_64.dmg$' SHA256SUMS.txt | cut -d' ' -f1)
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/michalsarna/homebrew-tap.git" tap
          sed -i -E "s/^  version \".*\"/  version \"$v\"/; s/arm:   \"[0-9a-f]{64}\"/arm:   \"$arm\"/; s/intel: \"[0-9a-f]{64}\"/intel: \"$intel\"/" tap/Casks/lightcreator.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Nothing to commit when the tap already has this version (a re-run, or a hand-made update).
          git diff --quiet || { git commit -am "lightcreator $v" && git push; }

      # winget: opens a pull request in microsoft/winget-pkgs from the fork in the token owner's account. Works once the
      # first version of MichalSarna.LightCreator has been merged there.
      - name: winget
        # Until the first version of the package has been accepted in microsoft/winget-pkgs this step is expected to fail.
        continue-on-error: true
        if: ${{ !cancelled() && env.WINGET_TOKEN != '' }}
        uses: vedantmgoyal9/winget-releaser@b7370d4d152efdce803a26cc6ca9eee58cb2ad54 # v2
        with:
          identifier: MichalSarna.LightCreator
          installers-regex: '-setup\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}

      # AUR: lightcreator-bin, built from the .deb files of the release (packaging/aur/PKGBUILD; checksums are filled in).
      - name: AUR package
        if: ${{ !cancelled() && env.AUR_SSH_PRIVATE_KEY != '' }}
        run: sed -i "s/^pkgver=.*/pkgver=${GITHUB_REF_NAME#v}/; s/^pkgrel=.*/pkgrel=1/" packaging/aur/PKGBUILD
      - if: ${{ !cancelled() && env.AUR_SSH_PRIVATE_KEY != '' }}
        uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
        with:
          pkgname: lightcreator-bin
          pkgbuild: packaging/aur/PKGBUILD
          updpkgsums: true
          commit_username: Michał Sarna
          commit_email: 5010807+michalsarna@users.noreply.github.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to ${{ github.ref_name }}"
