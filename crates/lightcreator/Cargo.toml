[package]
name = "lightcreator"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "LightCreator — open-source laser engraver / cutter design and control software"

[dependencies]
lc-core = { path = "../lc-core" }
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "persistence"] }
rfd = "0.17"
serialport = { version = "4", default-features = false }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
nokhwa = { version = "0.10", default-features = false, features = ["input-native"], optional = true }
serde = { version = "1.0.229", features = ["derive"] }
ureq = "2"
egui_extras = { version = "0.36", default-features = false, features = ["svg"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Native macOS menu bar (same approach as VectorCraft): Tauri's menu crate, AppKit menus behind a safe API.
muda = { version = "=0.21.1", default-features = false }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSImage"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData"] }
resvg = { version = "0.48.1", default-features = false }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[package.metadata.bundle]
name = "LightCreator"
identifier = "io.github.michalsarna.lightcreator"
icon = ["../../assets/icons/icon-256.png", "../../assets/icons/icon-512.png"]
short_description = "Open-source laser engraver / cutter design and control software"

[package.metadata.deb]
name = "lightcreator"
maintainer = "LightCreator contributors <noreply@github.com>"
section = "graphics"
priority = "optional"
# The GUI loads libxkbcommon-x11 and libGL at run time, so list them explicitly.
depends = "$auto, libxkbcommon-x11-0, libgl1"
extended-description = "Design shapes, import SVG, configure cut layers and stream jobs to GRBL laser controllers."
assets = [
  ["target/release/lightcreator", "usr/bin/", "755"],
  ["../../assets/lightcreator.desktop", "usr/share/applications/", "644"],
  ["../../assets/icons/icon-48.png", "usr/share/icons/hicolor/48x48/apps/lightcreator.png", "644"],
  ["../../assets/icons/icon-128.png", "usr/share/icons/hicolor/128x128/apps/lightcreator.png", "644"],
  ["../../assets/icons/icon-256.png", "usr/share/icons/hicolor/256x256/apps/lightcreator.png", "644"],
  ["../../assets/icons/icon-512.png", "usr/share/icons/hicolor/512x512/apps/lightcreator.png", "644"],
  ["../../README.md", "usr/share/doc/lightcreator/README.md", "644"],
]

[dev-dependencies]
# Renders the UI headlessly to PNG for the README screenshots (see src/screenshots.rs).
egui_kittest = { version = "0.36", features = ["wgpu"] }

[features]
# Live camera capture for the camera overlay: cargo run --release --features camera
camera = ["dep:nokhwa"]
